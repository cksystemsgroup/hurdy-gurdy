[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gurdy"
version = "0.0.1"
description = "hurdy-gurdy carried-over library: the interpreters, translators, and engine wrappers that registry entries import (KERNEL.md)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# The z3 SolverBackend adapter. Pinned to the dev-image version (DOCKER.md).
solvers = ["z3-solver>=4.16,<4.17"]

[tool.setuptools.packages.find]
include = ["gurdy*"]
