name: CI

# Kernel-era CI (KERNEL.md): the whole suite — kernel tests and quarry
# tests — with the z3 backend installed so the solver/commuting-square
# tests actually run, plus the repo-wide markdown link check. The
# kernel's own gate runs in-process during a run, never here; heavier,
# pinned-benchmark plays use the toolchain image (DOCKER.md) and are
# driven by hand. The Era-3 manifest and route-grader jobs retired with
# the machinery they served (HISTORY.md).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gurdy with the z3 solver backend
        run: python -m pip install -e ".[solvers]"
      - name: Unit tests (kernel + quarry)
        run: python -m unittest discover -s tests -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative markdown links
        run: python scripts/check_links.py
